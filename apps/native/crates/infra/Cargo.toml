[package]
name = "infra"
version = "0.1.0"
edition = "2021"

# native.md は「依存の向き: infra → domain」と記すが、ports(トレイト)は
# app に定義される(crates/app/ ports をトレイトで定義)ため、infra がそれを
# 実装するには app への依存が構造上必須(トレイトの orphan rule)。
# domain のみに依存する経路は存在しないため、ここでは app にも依存する。
[dependencies]
domain = { path = "../domain" }
app = { path = "../app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
notify-debouncer-full = "0.5"
reqwest = { version = "0.12", features = ["blocking", "json"] }
keyring = { version = "3", features = ["windows-native"] }
# system_uuid(MachineGuid)取得用(issue #182)。
winreg = "0.55"
# 実行中セッションのプロセス生存確認用(issue #345)。
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
