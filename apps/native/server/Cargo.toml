[package]
name = "server"
version = "0.1.0"
description = "YAOYOROZU のローカルサーバ(Next.js から使う。Tauri には依存しない)"
edition = "2021"

[dependencies]
axum = "0.8"
http-body = "1"
domain = { path = "../crates/domain" }
app = { path = "../crates/app" }
infra = { path = "../crates/infra" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = { version = "0.3", default-features = false }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
windows = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
